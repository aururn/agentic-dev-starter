name: relay-pr-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: relay-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relay-pr-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PR 本文を検査する
        run: node .github/scripts/relay-pr-policy.mjs
