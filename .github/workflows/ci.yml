name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 技術スタックを導入したら，ここに setup の step（actions/setup-node など）を追加する．
      - name: 必須検査
        run: bash scripts/check.sh

  pr-policy:
    name: pr-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Closes が正確に 1 件であることを検査する
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || "").replace(/<!--[\s\S]*?-->/g, "");
            const pattern = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const numbers = [...new Set([...body.matchAll(pattern)].map((m) => m[3]))];
            if (numbers.length !== 1) {
              core.setFailed(
                `PR 本文は対応する Issue を正確に 1 件だけ閉じる必要があります（検出：${numbers.length} 件 ${numbers.map((n) => "#" + n).join(", ")}）．` +
                  "docs/architecture/issue-pr-authoring.md を参照してください．",
              );
              return;
            }
            core.info(`closing issue: #${numbers[0]}`);
