name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # lockfile がない repository でも止まらないように，自動の cache を切る
          package-manager-cache: false
      - name: skill と file の検査
        run: node scripts/validate.mjs
      - name: relay-pr-policy の test
        run: node --test "tests/**/*.test.mjs"
