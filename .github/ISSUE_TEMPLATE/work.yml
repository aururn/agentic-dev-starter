name: 作業
description: 機能追加，改善，文書，調査など，1 つの PR で完了する作業
title: ""
body:
  - type: markdown
    attributes:
      value: |
        1 Issue = 1 PR = 1 レビュー単位．1 回のレビューで読めない大きさなら「大項目（epic）」で作る．
        書き方は `docs/architecture/issue-pr-authoring.md` に従う．未確定の項目は推測せず `未確定` と書く．

  - type: textarea
    id: goal
    attributes:
      label: ゴール
      description: 完了したら何ができるようになるかを 1〜2 文で書く
      placeholder: 管理者が期限切れの招待を再送できる．
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ今必要か，現在の問題を書く
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 要求振る舞い
      description: 1 規則につき 1 シナリオを Given-When-Then で書く．UI 操作ではなく目的と観測できる結果を書く
      render: text
      placeholder: |
        Scenario: 管理者が期限切れの招待を再送する
        Given: organization の管理者として認証されている
        When: 期限切れの招待を再送する
        Then: 同じ宛先に新しい期限の招待が 1 件作成される
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 第三者が完了を判定できる条件を checklist で書く
      placeholder: |
        - [ ] 管理者は期限切れの招待を再送できる
        - [ ] 管理者でない member は再送できない
    validations:
      required: true

  - type: textarea
    id: test_plan
    attributes:
      label: テスト計画
      description: 振る舞いごとに最低十分なテスト層（docs/testing-strategy.md）と代表 case を書く
      placeholder: |
        | 振る舞い・リスク | 層 | 代表 case | 自動化しない理由 |
        | --- | --- | --- | --- |
        | 招待を再送する | I | 管理者の正常系，権限なしの拒否 | - |
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 範囲
      description: 対象と対象外を並べて書く
      value: |
        **対象**
        -

        **対象外**
        -
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: 変更予定
      description: 変更予定の path を glob で書く．未確定なら，決めるために必要な調査を書く
      placeholder: |
        - `src/invitations/**`
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 実装後に実行する予定の command と手動確認を書く
      placeholder: |
        - [ ] `bash scripts/check.sh`
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参照
      description: 正本の docs，ADR，外部仕様，関連 Issue
    validations:
      required: false

  - type: textarea
    id: risk
    attributes:
      label: リスクと切り戻し
      description: 失敗したときの影響と安全な戻し方
    validations:
      required: false
